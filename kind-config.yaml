# kind cluster config with reduced etcd quota for demo purposes.
# This keeps the quota at 100MiB, but uses a compaction window longer than the
# stage demo so status-update revisions visibly accumulate before recovery.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: etcd-mvcc-demo
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # Required for the native guardrail demo. The API resource can exist
        # without this admission plugin actually enforcing policies.
        enable-admission-plugins: "NodeRestriction,ValidatingAdmissionPolicy"
    etcd:
      local:
        extraArgs:
          # 100MB quota — small enough to fill quickly during demo
          quota-backend-bytes: "104857600"
          # Leave old revisions around long enough for a <1 minute stage demo.
          # The recovery path still demonstrates manual compact + defrag.
          auto-compaction-mode: periodic
          auto-compaction-retention: "10m"
- role: worker
- role: worker
