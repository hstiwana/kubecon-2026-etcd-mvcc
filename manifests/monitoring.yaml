# Optional note for demo operators.
# The stage monitor is './demo.sh monitor'. It reads metrics from the kind
# control-plane container and does not deploy a pod or pull an etcd image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-mvcc-monitoring-note
  namespace: kube-system
data:
  monitor: ./demo.sh monitor
  reason: Uses the existing kind control-plane container, avoiding extra image pulls during the demo.
